name: noor_life
description: Production-ready foundation for NoorLife.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.5.0
  get_it: ^7.7.0
  injectable: ^2.6.0
  logger: ^2.3.0
  flutter_dotenv: ^5.2.1
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  firebase_core: ^3.8.0
  firebase_auth: ^5.7.0
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.0.10
  timezone: ^0.9.4
  hijri: ^3.0.1
  geolocator: ^11.1.0
  lat_lng_to_timezone: ^0.2.0
  geocoding: ^3.0.0
  flutter_compass: ^0.8.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.5.4
  riverpod_generator: ^2.6.5
  injectable_generator: ^2.7.0
  json_serializable: ^6.9.5
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/svgs/
    - assets/translations/
    - assets/data/quran/surahs.json
    - assets/data/quran/quran.json
    - assets/data/quran/SOURCE.md
